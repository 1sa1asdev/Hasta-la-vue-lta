name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Kvalitet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  build:
    name: Bygg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload client dist
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
  integration:
    name: Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: utpost
          POSTGRES_PASSWORD: utpost
          POSTGRES_DB: utpost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utpost -d utpost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mongo:
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: utpost
          MONGO_INITDB_ROOT_PASSWORD: utpost
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --username utpost --password utpost --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://utpost:utpost@localhost:5432/utpost
      MONGO_URL: mongodb://utpost:utpost@localhost:27017/utpost?authSource=admin
      JWT_SECRET: integration-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed databases
        run: npm run seed

      - name: Migrate tour logs to MongoDB
        run: npm run migrate:logs

      - name: Run API integration tests
        run: npm run test:api

  image:
    name: Image
    runs-on: ubuntu-latest
    needs: [quality, build, integration]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image metadata
        id: api_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/1sa1asdev/hasta-la-vue-lta-api
          tags: |
            type=sha,format=short,prefix=sha-

      - name: Client image metadata
        id: client_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/1sa1asdev/hasta-la-vue-lta-client
          tags: |
            type=sha,format=short,prefix=sha-

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.api_meta.outputs.tags }}
          labels: ${{ steps.api_meta.outputs.labels }}

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.client_meta.outputs.tags }}
          labels: ${{ steps.client_meta.outputs.labels }}
