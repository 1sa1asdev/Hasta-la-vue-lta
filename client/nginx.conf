server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST → backend (no trailing slash on proxy_pass keeps the /api/ prefix)
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # GraphQL → backend
    location /graphql {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: unknown paths like /tours or /guides get index.html,
    # and Vue Router takes over from there
    location / {
        try_files $uri $uri/ /index.html;
    }
}
